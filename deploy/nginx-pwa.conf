# Aturan Cache Nginx untuk PWA (Laravel 11 + Inertia Vue 3)
# Pastikan sw.js dan manifest.webmanifest di root /public TIDAK pernah di-cache oleh browser
location ~* ^/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
}

# Aset hasil build Vite (dengan hash nama file) aman di-cache 1 tahun (immutable)
location ^~ /build/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    access_log off;
}

